<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Favicons + PWA manifest -->
  <link rel="icon" type="image/svg+xml" href="/images/runningdinner-logo.svg">
  <link rel="icon" type="image/png" sizes="240x240" href="/images/runningdinner-icon-240.png">
  <link rel="apple-touch-icon" sizes="240x240" href="/images/runningdinner-icon-240.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#E85D3A">
  <title>Wachtwoord vergeten – Running Dinner Planner</title>
  <link rel="alternate" hreflang="nl" href="https://runningdinner.app/forgot-password.html">
  <link rel="alternate" hreflang="en" href="https://runningdinner.app/en/forgot-password.html">
  <link rel="alternate" hreflang="es" href="https://runningdinner.app/es/forgot-password.html">
  <link rel="alternate" hreflang="de" href="https://runningdinner.app/de/forgot-password.html">
  <link rel="alternate" hreflang="x-default" href="https://runningdinner.app/forgot-password.html">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/home.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
</head>
<body>
<div style="position:fixed;top:12px;right:16px;z-index:1000" id="auth-lang-toggle"></div>
<div class="auth-page">
  <div class="auth-card">
    <a href="/" class="auth-logo" aria-label="runningdinner.app"><img src="/images/runningdinner-logo-nav.png" alt="runningdinner.app" width="200" height="53" style="max-width:200px;height:auto;display:block;margin:0 auto"></a>
    <h1 class="auth-title" data-i18n="auth.forgot.title">Wachtwoord vergeten?</h1>
    <p class="auth-subtitle" data-i18n="auth.forgot.subtitle">Voer je e-mailadres in. Als het bekend is, sturen we een resetlink.</p>

    <div class="auth-success" id="success-msg"></div>
    <div class="auth-error"   id="error-msg"></div>

    <form class="auth-form" id="forgot-form">
      <div class="form-group">
        <label for="email" data-i18n="auth.forgot.email_label">E-mailadres</label>
        <input type="email" id="email" autocomplete="email" placeholder="jouw@email.nl" data-i18n-placeholder="auth.forgot.email_placeholder" required>
      </div>
      <button type="submit" class="btn-primary" id="submit-btn" data-i18n="auth.forgot.submit">Verstuur resetlink</button>
    </form>

    <div class="auth-links">
      <a href="/login.html" data-i18n="auth.forgot.back_to_login">← Terug naar inloggen</a>
    </div>
  </div>
</div>
<script defer data-domain="runningdinner.app" data-api="/api/event" src="/js/script.js"></script>
<script src="/lang/i18n.js?v=de1"></script>
  <script src="/js/pages/forgot-password.js?v=1"></script>
</body>
</html>
